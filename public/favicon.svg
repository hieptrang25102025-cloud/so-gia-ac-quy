<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C93642"/>
      <stop offset="100%" stop-color="#8E1722"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#2F855A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background circle/rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Battery Body -->
  <g filter="url(#shadow)" transform="translate(66, 120)">
    <!-- Terminal posts -->
    <rect x="70" y="20" width="46" height="40" rx="8" fill="#E2E8F0"/>
    <rect x="78" y="8" width="30" height="16" rx="4" fill="#3182CE"/>
    <text x="87" y="22" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">-</text>

    <rect x="264" y="20" width="46" height="40" rx="8" fill="#E2E8F0"/>
    <rect x="272" y="8" width="30" height="16" rx="4" fill="#E53E3E"/>
    <text x="281" y="22" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">+</text>

    <!-- Handle -->
    <path d="M 120 40 Q 190 0 260 40" fill="none" stroke="#CBD5E0" stroke-width="14" stroke-linecap="round"/>

    <!-- Main battery casing -->
    <rect x="30" y="55" width="320" height="230" rx="28" fill="#A91F2C" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Top rim -->
    <rect x="20" y="55" width="340" height="40" rx="12" fill="#78131C"/>

    <!-- Central White Emblem -->
    <circle cx="190" cy="180" r="58" fill="#FFFFFF"/>
    
    <!-- Lightning Bolt -->
    <polygon points="194,136 166,182 188,182 184,224 214,174 192,174" fill="#C93642"/>
  </g>

  <!-- Fresh Green Leaf -->
  <g transform="translate(310, 260) rotate(15)">
    <path d="M 0 70 C 0 10, 60 0, 110 0 C 110 60, 90 120, 0 120 C 0 100, 0 85, 0 70 Z" fill="url(#leafGrad)"/>
    <path d="M 0 120 Q 50 70 110 0" fill="none" stroke="#9AE6B4" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
